name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production.momentum.joehunter.dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # - name: Setup PHP
      #   uses: shivammathur/setup-php@v2
      #   with:
      #     php-version: '8.4'
      #     tools: composer

      # - name: Install Composer dependencies
      #   run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # - name: Build frontend assets
      #   run: |
      #     npm ci
      #     npm run build

      - name: Deploy via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git' --exclude='.github' --exclude='.docs' --exclude='.vscode' --exclude='.idea' --exclude='.fleet' --exclude='node_modules' --exclude='tests' --exclude='storage/logs/*' --exclude='storage/framework/cache/*' --exclude='storage/framework/sessions/*' --exclude='storage/framework/views/*' --exclude='**/.private' --exclude='.env' --exclude='package.json' --exclude='package-lock.json' --exclude='README.md' --exclude='TODO.md'
          path: ./
          remote_path: ${{ secrets.SSH_DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
            **/.private/**
            node_modules/**
            vendor/**
            tests/**
            storage/logs/**
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/testing/**
            storage/framework/views/**
            storage/debugbar/**
            docs/**
            .env*
            *.log
            npm-debug.log
            yarn-error.log
            .phpunit.cache
            .phpunit.result.cache
            phpunit.xml
            package*.json
            README.md
            TODO.md
            *.code-workspace